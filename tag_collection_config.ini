# Configuration for Tag Words Collection
# Edit this file to enable/disable different data sources

[CORE_SOURCES]
# These are essential and should always be enabled
mesh_descriptors = True
mesh_supplementary = True

[GENETICS_SOURCES]
# Gene and protein related terms
hgnc_genes = False  # Set to True if you have hgnc_complete_set.txt
gene_ontology = True  # Set to True if you have go-basic.obo

[DISEASE_SOURCES]
# Disease and condition related terms
disease_ontology = True  # Set to True if you have doid.obo
clinical_trials_conditions = True  # Curated list of major conditions

[DRUG_SOURCES]
# Pharmaceutical and treatment terms
drugbank = False  # Set to True if you have drugbank_vocabulary.csv
common_drugs = True  # Curated list of common drugs and drug classes

[TECHNIQUE_SOURCES]
# Research methods and experimental approaches
omics_terms = True
research_techniques = True

[ANATOMY_SOURCES]
# Anatomical structures and cell types
anatomy_terms = True
uberon_ontology = False  # Set to True if you have uberon.obo (large file)

[PATHWAY_SOURCES]
# Biological pathways and processes
curated_pathways = True
reactome_pathways = False  # Set to True if you have ReactomePathways.txt

[PROCESSING_OPTIONS]
# Text processing options
min_term_length = 2  # Minimum character length for terms
remove_stopwords = True  # Remove generic words like "the", "and"
remove_duplicates = True  # Remove exact duplicates (case-insensitive)

[OUTPUT_OPTIONS]
# Output file configuration
output_file = all_tag_words.txt
output_format = txt  # Options: txt, json, csv
include_statistics = True  # Print detailed statistics
sort_output = True  # Sort terms alphabetically

[CATEGORIZATION]
# Whether to create category-specific output files
create_category_files = False  # If True, creates separate files per category
category_prefix = tags_  # Prefix for category files (e.g., tags_diseases.txt)

# Category-specific output files (only if create_category_files = True)
# This helps users select from specific categories in your UI
categories = [
    "mesh",
    "diseases", 
    "genes",
    "drugs",
    "techniques",
    "anatomy",
    "pathways"
]
