# Nginx configuration for app.daily-academic.com
# This configuration serves the React frontend and proxies API requests to FastAPI backend

# ---------------------------------------------------------------------------
# Rate limiting zones (must be in the http context - add inside your http{} block
# in /etc/nginx/nginx.conf if these directives are not in a server block context,
# or place this file as a site config that is included inside http{}).
# ---------------------------------------------------------------------------
# General API zone: 30 requests/minute per IP
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/m;
# Strict zone for expensive search endpoints: 10 requests/minute per IP
limit_req_zone $binary_remote_addr zone=api_search:10m rate=10r/m;
# Connection limiter: max simultaneous connections per IP to /api/
limit_conn_zone $binary_remote_addr zone=api_conn:10m;

# Redirect all HTTP traffic to HTTPS — prevents tokens being sent in plaintext
server {
    listen 80;
    listen [::]:80;
    server_name app.daily-academic.com;

    # Allow Let's Encrypt certificate renewal over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Main server block (HTTP kept only as fallback for local/pre-SSL use)
server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # For Let's Encrypt SSL certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Logs
    access_log /var/log/nginx/daily-academic-access.log;
    error_log /var/log/nginx/daily-academic-error.log;

    # Root directory for React build
    root /root/academic.daily.app/frontend/dist;
    index index.html;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # -----------------------------------------------------------------------
    # Search endpoints — strict rate limit (10 req/min, burst 5)
    # -----------------------------------------------------------------------
    location /api/search/ {
        limit_req zone=api_search burst=5 nodelay;
        limit_req_status 429;
        limit_conn api_conn 10;

        proxy_pass http://127.0.0.1:8000/search/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -----------------------------------------------------------------------
    # Clerk webhooks — no rate limiting, proxied directly to FastAPI
    # -----------------------------------------------------------------------
    location /webhooks/ {
        proxy_pass http://127.0.0.1:8000/webhooks/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # -----------------------------------------------------------------------
    # General API proxy — 30 req/min, burst 15
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=15 nodelay;
        limit_req_status 429;
        limit_conn api_conn 20;

        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static files with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle React Router - serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# HTTPS server block (uncomment after setting up SSL with certbot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.daily-academic.com;

    # SSL certificate paths (will be configured by certbot)
    ssl_certificate /etc/letsencrypt/live/app.daily-academic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.daily-academic.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Logs
    access_log /var/log/nginx/daily-academic-ssl-access.log;
    error_log /var/log/nginx/daily-academic-ssl-error.log;

    # Root directory for React build
    root /root/academic.daily.app/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # -----------------------------------------------------------------------
